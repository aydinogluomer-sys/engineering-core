name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate runtime skill package
        run: python engineering-core/scripts/validate_skill.py engineering-core
      - name: Run validator mutation tests
        run: python engineering-core/scripts/test_validate_skill.py
      - name: Run completion-contract parser tests
        run: python evals/test_completion_summary.py
      - name: Run L4 scorer event tests
        run: python evals/test_l4_eval.py
      - name: Run activation-harness tests
        run: python evals/activation/test_activation_eval.py
      - name: Run Formal Spec Team Mode harness tests
        run: python evals/formal-spec-team/test_team_eval.py
      - name: Run cross-model provenance and schema tests
        run: python evals/cross-model/test_cross_model_matrix.py
      - name: Compile Python validation tools
        run: python -m py_compile engineering-core/scripts/validate_skill.py engineering-core/scripts/test_validate_skill.py scripts/validate_repository.py evals/completion_summary.py evals/cross_model.py evals/test_completion_summary.py evals/run_l4_eval.py evals/test_l4_eval.py evals/activation/run_activation_eval.py evals/activation/test_activation_eval.py evals/formal-spec-team/run_team_eval.py evals/formal-spec-team/test_team_eval.py evals/cross-model/run_mode_selection_eval.py evals/cross-model/test_cross_model_matrix.py
      - name: Validate public repository hygiene
        run: python scripts/validate_repository.py .
